add('Fake handoff','R',[P('WR1',55,245,55,185,30,185),P('WR2',290,245,290,45),P('C',170,245,170,115,265,115),Q,P('RB',225,285,175,285,105,285,83,245,83,215)],a('WR2','WR1','C','RB'),{q:question('The RB crosses the backfield. What should the defense do?',['Rotate as though RB has the ball','Identify who has the ball and maintain passing coverage','Send the rusher after RB','Send the weak corner after RB'],1,'QB kept the ball. RB becomes a receiver, not a runner.'),cut:.55});

const app=document.getElementById('app');const names={sc:'Strong corner',wc:'Weak corner',s:'Safety',m:'Middle',r:'Rusher'};const labels={sc:'CB',wc:'CB',s:'S',m:'M',r:'R'};let order=[],index=0,score=0,total=0,play,stage,answers,active,choice,progress=0,mirrored=false,animation=0,timed=false,started=0,elapsed=0,mode='all';
const shuffle=x=>{x=[...x];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};const last=o=>o.pts[o.pts.length-1];const X=x=>mirrored?340-x:x;const point=(p)=>[X(p[0]),p[1]];
function defenders(before=false){let s=play.side;if(before&&play.motion)s='R';let d={sc:[290,205],wc:[50,205],s:[225,200],m:[145,205],r:[170,175]};if(play.formation==='trips')d={sc:[290,205],wc:[130,205],s:[205,200],m:[250,205],r:[170,175]};if(play.formation==='bunch')d={sc:[270,205],wc:[130,205],s:[203,200],m:[239,205],r:[170,175]};if(s==='L')for(const k in d)d[k][0]=340-d[k][0];if(play.goal){d.sc[1]=d.wc[1]=play.goal===3?225:210;d.s[1]=play.goal===3?215:205;d.m[1]=d.sc[1];if(play.goal===4)d.r[1]=165;}return d;}
function pos(o,t){let pts=o.pts;if(play.delay===o.id)t=Math.max(0,(t-.28)/.72);if(pts.length===1)return pts[0];let lens=pts.slice(1).map((p,i)=>Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1])),dist=lens.reduce((a,b)=>a+b,0)*Math.min(1,t);for(let i=0;i<lens.length;i++){if(dist<=lens[i]||i===lens.length-1){let f=lens[i]?dist/lens[i]:0;return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f,pts[i][1]+(pts[i+1][1]-pts[i][1])*f]}dist-=lens[i]}return last(o)}
function ball(t){if(t===0&&stage==='formation')return [170,257];let events=play.ball||[['QB',0]],holder=events[0][0];for(let i=1;i<events.length;i++){let [next,at]=events[i];if(t>=at&&t<at+.10){let a=pos(play.receivers.find(o=>o.id===holder),t),b=pos(play.receivers.find(o=>o.id===next),t),f=(t-at)/.10;return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}if(t>=at+.10)holder=next;}let p=pos(play.receivers.find(o=>o.id===holder),t);return [p[0]+9,p[1]+10]}
function marker(p,label,color,stroke,extra=''){let [x,y]=point(p);return `<g ${extra}><circle cx="${x}" cy="${y}" r="11.5" fill="${color}" stroke="${stroke}" stroke-width="1.5"/><text x="${x}" y="${y+3.3}" text-anchor="middle" font-size="8.5" font-weight="900" fill="#101218">${label}</text></g>`}
function line(a,b,color,extra=''){let [x,y]=point(a),[u,v]=point(b);return `<line x1="${x}" y1="${y}" x2="${u}" y2="${v}" stroke="${color}" ${extra}/>`}
function finalPosition(k,d){let o=play.receivers.find(o=>o.id===play.ans[k]),p=last(o),start=d[k],dx=start[0]-p[0],dy=start[1]-p[1],len=Math.hypot(dx,dy)||1;return [p[0]+dx/len*23,p[1]+dy/len*23]}
function field(){let t=progress,goal=play.goal?245-play.goal*10:null,d=defenders(stage==='formation'||stage==='motion');let svg=`<svg id="field" viewBox="0 ${goal?125:0} 340 ${goal?215:340}" aria-label="Football field"><rect x="15" y="15" width="310" height="315" fill="none" stroke="#809b8c"/>`;if(goal){svg+=`<rect x="15" y="125" width="310" height="${goal-125}" fill="#253c34"/><text x="170" y="148" text-anchor="middle" fill="#ffffff33" font-size="20" font-weight="900">END ZONE</text><rect x="15" y="${goal}" width="310" height="50" fill="#ffd45016"/>${line([15,goal],[325,goal],'white','stroke-width="2"')}${line([15,goal+50],[325,goal+50],'#ffd450','stroke-dasharray="4 4"')}`;}else{for(let y=45;y<=295;y+=50){svg+=line([15,y],[325,y],'#90aa9b','opacity=".45"');if(y<=245)svg+=`<text x="20" y="${y-5}" fill="#9cb6ab" font-size="9">${(245-y)/10}</text>`;for(let h=10;h<50;h+=10)for(let x of [110,230])svg+=line([x-4,y+h],[x+4,y+h],'#90aa9b','opacity=".4"');}svg+='<text x="170" y="115" fill="#ffffff0e" font-size="46" font-weight="900" text-anchor="middle">FIRE</text>';}svg+=line([170,15],[170,330],'#ffffff44','stroke-dasharray="4 5"')+line([15,245],[325,245],'white','stroke-dasharray="5 4" stroke-width="1.5"');

for(let k of Object.keys(d)){if(stage==='assign'&&answers[k])svg+=line(d[k],last(play.receivers.find(o=>o.id===answers[k])),'#61cfff','stroke-width="2" stroke-dasharray="5 4"');if(stage==='review')svg+=line(d[k],finalPosition(k,d),'#b7ff30','stroke-width="2" stroke-dasharray="5 4"');}

const keys=()=>play.manual?['sc','wc','s','m','r']:['sc','wc','s','m'];function home(){cancelAnimationFrame(animation);app.innerHTML=`<div class="panel"><h2>Train like FIRE.</h2><p>Read the formation. Recognize the play. Assign every defender.</p><label>Session <select id="mode"><option value="all">All 25 plays Â· randomized</option><option value="quick">Quick challenge Â· 5 plays</option><option value="coach">Coach review Â· original order</option></select></label><label><input type="checkbox" id="timed"> Timed mode (tracks elapsed time)</label><button class="primary" id="start">START TRAINING</button><p class="muted">Coach-testing edition Â· scores stay in this session. No player accounts.</p></div>`;document.getElementById('start').onclick=()=>{mode=document.getElementById('mode').value;timed=document.getElementById('timed').checked;order=mode==='coach'?[...plays]:shuffle(plays);if(mode==='quick')order=order.slice(0,5);index=score=total=0;started=Date.now();load();};}
function load(){play=order[index];mirrored=mode!=='coach'&&Math.random()<.5;stage='formation';answers={};active='sc';choice=null;progress=0;render();}

function lock(){if(keys().some(k=>!answers[k]))return;score+=keys().filter(k=>answers[k]===play.ans[k]).length+(play.q&&choice===play.q.answer?1:0);total+=keys().length+(play.q?1:0);stage='review';render();}
function render(){let info=play.goal?`<div class="row panel"><div><small>DOWN</small><br><b>${play.goal===3?'3RD':'4TH'}</b></div><div><small>TO GO</small><br><b>${play.goal} YDS</b></div><div><small>POSITION</small><br><b>${play.goal}-YD LINE</b></div></div>`:'';let controls='';if(stage==='formation')controls='<h2>Read the formation.</h2><button id="snap" class="primary">'+(play.motion?'CONTINUE':'SNAP BALL')+'</button>';if(stage==='running')controls='<p class="step">Watch the play developâ¦</p>';if(stage==='question'||stage==='motion')controls=`<h2>${play.q.prompt}</h2><div class="grid">${play.q.options.map((o,i)=>`<button data-choice="${i}">${o}</button>`).join('')}</div>`;if(stage==='assign')controls=`<p class="step">SELECT A DEFENDER</p><div class="grid">${keys().map(k=>`<button data-defender="${k}" class="${active===k?'selected':''}">${names[k]} Â· ${answers[k]||'â'}</button>`).join('')}</div><p class="step">CHOOSE THEIR RESPONSIBILITY</p><div class="choices">${play.receivers.filter(o=>play.manual||o.id!=='QB').map(o=>`<button class="receiver ${answers[active]===o.id?'selected':''}" data-receiver="${o.id}">${o.id}</button>`).join('')}</div>${!play.manual?'<p class="muted">Rusher â QB Â· Automatic</p>':''}<button id="lock" class="primary" ${keys().some(k=>!answers[k])?'disabled':''}>LOCK IN DEFENSE</button>`;if(stage==='review'){let n=keys().filter(k=>answers[k]===play.ans[k]).length+(play.q&&choice===play.q.answer?1:0);controls=`<h2 class="lime">${n}/${keys().length+(play.q?1:0)} CORRECT</h2><p>${play.name}</p>${play.q?`<div class="feedback"><b class="${choice===play.q.answer?'correct':'wrong'}">${choice===play.q.answer?'â':'â'} Decision question</b><p>${play.q.why}</p></div>`:''}${keys().map(k=>`<div class="row feedback"><span class="${answers[k]===play.ans[k]?'correct':'wrong'}">${answers[k]===play.ans[k]?'â':'â'} ${names[k]}</span><b>${play.ans[k]}</b>${answers[k]!==play.ans[k]?`<small>Your answer: ${answers[k]}</small>`:''}</div>`).join('')}<button id="next" class="primary">${index===order.length-1?'FINISH SESSION':'NEXT PLAY'}</button><button id="replay" style="margin-top:8px;width:100%">REPLAY ANIMATION</button>`;}
app.innerHTML=`<div class="panel"><div class="row stats"><span>PLAY ${index+1}/${order.length}</span><span class="lime">${score}/${total} POINTS</span></div><div class="bar"><i style="width:${100*index/order.length}%"></i></div>${info}<div id="fieldwrap">${field()}</div><div class="legend"><span style="color:#ff329b">â Offense</span><span class="lime">â Defense</span><span style="color:#ffd450">â Football</span></div><div class="step">${stage==='formation'?'FORMATION':stage==='review'?'REVIEW':stage==='assign'?'ASSIGNMENTS':'REACTION'}</div>${controls}</div><button id="quit">END SESSION</button>`;}
function finish(){cancelAnimationFrame(animation);elapsed=Math.round((Date.now()-started)/1000);app.innerHTML=`<div class="panel"><h2>SESSION COMPLETE</h2><h1 class="lime">${total?Math.round(score/total*100):0}%</h1><p>${score} of ${total} points</p>${timed?`<p>Time: ${Math.floor(elapsed/60)}m ${elapsed%60}s</p>`:''}<button class="primary" id="home">PLAY AGAIN</button></div>`;}
app.addEventListener('click',e=>{let el=e.target.closest('button,[data-defender],[data-receiver]');if(!el||el.disabled)return;if(el.id==='snap')snap();if(el.id==='lock')lock();if(el.id==='next'){if(++index>=order.length)finish();else load();}if(el.id==='home')home();if(el.id==='quit'){if(confirm('End this session?'))finish();}if(el.id==='replay'){progress=0;animate(1,()=>{stage='review';render()});}if(el.dataset.choice!==undefined)choose(Number(el.dataset.choice));if(stage==='assign'&&el.dataset.defender){active=el.dataset.defender;render();}if(stage==='assign'&&el.dataset.receiver)assign(el.dataset.receiver);});home();
</script></body></html>
