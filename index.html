function pos(o,t){if(o.pts.length===1)return o.pts[0];let v=o.geometry.getPointAtLength(o.geometry.getTotalLength()*Math.min(1,routeTime(o,t)));return [v.x,v.y];}
function ball(t){if(t===0&&(stage==='formation'||stage==='motion')){let h=play.receivers.find(o=>o.id===(play.ball?.[0][0]||'QB'));return [h.pts[0][0]+9,h.pts[0][1]+5];}let events=play.ball||[['QB',0]],holder=events[0][0];for(let i=1;i<events.length;i++){let [next,at]=events[i];if(t>=at&&t<at+.10){let a=pos(play.receivers.find(o=>o.id===holder),t),b=pos(play.receivers.find(o=>o.id===next),t),f=(t-at)/.10;return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}if(t>=at+.10)holder=next;}let p=pos(play.receivers.find(o=>o.id===holder),t);return [p[0]+9,p[1]+10]}
function marker(p,label,color,stroke,extra=''){let [x,y]=point(p);return `<g ${extra}><circle cx="${x}" cy="${y}" r="${play.id===17&&color==='#ff329b'&&label!=='QB'?10:11.5}" fill="${color}" stroke="${stroke}" stroke-width="1.5"/><text x="${x}" y="${y+3.3}" text-anchor="middle" font-size="8.5" font-weight="900" fill="#101218">${label}</text></g>`}
function line(a,b,color,extra=''){let [x,y]=point(a),[u,v]=point(b);return `<line x1="${x}" y1="${y}" x2="${u}" y2="${v}" stroke="${color}" ${extra}/>`}
function finalPosition(k,d){return play.end[k];}
function field(){let t=progress,goal=play.goal?245-play.goal*10:null,d=defenders(stage==='formation'||stage==='motion');let svg=`<svg id="field" viewBox="0 ${goal?105:0} 340 ${goal?230:(play.id>=20||[6,11,15].includes(play.id)?340:310)}" aria-label="Football field"><rect x="15" y="15" width="310" height="${goal?310:(play.id>=20?315:285)}" fill="none" stroke="#809b8c"/>`;if(goal){svg+=`<rect x="15" y="125" width="310" height="${goal-125}" fill="#253c34"/><text x="170" y="148" text-anchor="middle" fill="#ffffff33" font-size="20" font-weight="900">END ZONE</text><rect x="15" y="${goal}" width="310" height="50" fill="#ffd45016"/>${line([15,goal],[325,goal],'white','stroke-width="2"')}${line([15,goal+50],[325,goal+50],'#ffd450','stroke-dasharray="4 4"')}`;}else{for(let y=45;y<=295;y+=50){svg+=line([15,y],[325,y],'#90aa9b','opacity=".45"');if(y<=245)svg+=`<text x="20" y="${y-5}" fill="#9cb6ab" font-size="9">${(245-y)/10}</text>`;for(let h=10;h<50;h+=10)for(let x of [110,230])svg+=line([x-4,y+h],[x+4,y+h],'#90aa9b','opacity=".4"');}svg+='<text x="170" y="115" fill="#ffffff0e" font-size="46" font-weight="900" text-anchor="middle">FIRE</text>';}svg+=line([170,15],[170,330],'#ffffff44','stroke-dasharray="4 5"')+line([15,245],[325,245],'white','stroke-dasharray="5 4" stroke-width="1.5"');
if(stage==='delay')svg+='<circle cx="170" cy="245" r="17" fill="none" stroke="#ffd450" stroke-width="2"/>';if(stage==='motion')svg+=line([225,260],[120,260],'#ffd450','stroke-width="3" stroke-dasharray="5 4"');
for(let o of play.receivers){if(t>0&&o.pts.length>1){let len=o.geometry.getTotalLength(),part=len*routeTime(o,t);if(part>0)svg+=`<path d="${o.path}" fill="none" stroke="#ff329b" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="${part} ${len+1}" opacity="${stage==='review'?.35:1}" ${mirrored?'transform="translate(340 0) scale(-1 1)"':''}/>`;}}
if(t>0&&[6,11,15,20,25].includes(play.id)&&t>=play.ball[1][1]+.1){let target=play.receivers.find(o=>o.id===play.ball[1][0]);svg+=line([185,285],last(target),'#ffd450','stroke-width="2" stroke-dasharray="5 4"');}
for(let k of Object.keys(d)){if(stage==='assign'&&answers[k])svg+=line(d[k],last(play.receivers.find(o=>o.id===answers[k])),'#61cfff','stroke-width="2" stroke-dasharray="5 4"');if(stage==='review')svg+=line(d[k],finalPosition(k,d),'#b7ff30','stroke-width="2" stroke-dasharray="5 4"');}
for(let o of play.receivers){let p=stage==='assign'&&(!play.manual||!['WR1','WR3'].includes(o.id)||![6,11,15,20,23,25].includes(play.id))?o.pts[0]:pos(o,t);if(play.motion&&stage==='formation'&&o.id==='WR2')p=[225,260];svg+=marker(p,o.id,'#ff329b','#ffc0de',stage==='assign'?`data-receiver="${o.id}" style="cursor:pointer"`:'');}for(let k of Object.keys(d))svg+=marker(stage==='review'?finalPosition(k,d):stage==='question'&&((play.id===9&&k==='sc')||(play.id===13&&k==='sc')||(play.id===15&&k==='wc')||(play.id===18&&k==='sc'))?[d[k][0],({9:150,13:145,15:150,18:151})[play.id]]:d[k],labels[k],'#b7ff30',stage==='assign'&&active===k?'white':'#e0ffab',stage==='assign'&&keys().includes(k)?`data-defender="${k}" style="cursor:pointer"`:'');let [bx,by]=point(ball(t));svg+=`<ellipse cx="${bx}" cy="${by}" rx="5" ry="3" fill="#ffd450" stroke="#8d6320"/></svg>`;return svg;}
const keys=()=>play.manual?['sc','wc','s','m','r']:['sc','wc','s','m'];function home(){cancelAnimationFrame(animation);app.innerHTML=`<div class="panel homecard"><h2>Train like FIRE.</h2><p>Read the formation. Recognize the play. Assign every defender.</p><label>Session <select id="mode"><option value="all">All 25 plays / randomized</option><option value="quick">Quick challenge / 5 plays</option><option value="coach">Coach review / original order</option></select></label><label>Coach start at play <select id="coachStart">${plays.map(p=>`<option value="${p.id}">${p.id} - ${p.name}</option>`).join('')}</select></label><label><input type="checkbox" id="timed"> Timed mode (tracks elapsed time)</label><button class="primary" id="start">START TRAINING</button><p class="muted">25 plays / fixed defensive positions / coach review. No player accounts.</p></div>`;document.getElementById('start').onclick=()=>{mode=document.getElementById('mode').value;timed=document.getElementById('timed').checked;order=mode==='coach'?[...plays]:shuffle(plays);if(mode==='quick')order=order.slice(0,5);index=mode==='coach'?Number(document.getElementById('coachStart').value)-1:0;score=total=0;results.clear();started=Date.now();load();};}
function load(){play=order[index];mirrored=false;stage='formation';answers={};active='sc';choice=null;progress=0;render();}
function animate(to,done){stage='running';render();let from=progress,start=performance.now(),duration=Math.max(400,2200*(to-from));function tick(now){let f=Math.min(1,(now-start)/duration);progress=from+(to-from)*f;document.getElementById('fieldwrap').innerHTML=field();if(f<1)animation=requestAnimationFrame(tick);else done();}animation=requestAnimationFrame(tick);}
function snap(){if(play.delay){animate(.5,()=>{stage='delay';render()});return;}if(play.motion){stage='motion';render();return;}animate(play.q?(play.cut||.88):1,()=>{stage=play.q?'question':'assign';render()});}
function choose(i){choice=i;if(stage==='motion'){progress=0;animate(1,()=>{stage='assign';render()});}else if(progress<1){animate(1,()=>{stage='assign';render()});}else{stage='assign';render();}}
function assign(id){if(!play.receivers.some(o=>o.id===id)||(!play.manual&&id==='QB'))return;answers[active]=id;let next=keys().find(k=>!answers[k]);if(next)active=next;render();}
function lock(){if(keys().some(k=>!answers[k]))return;let n=keys().filter(k=>answers[k]===play.ans[k]).length+(play.q&&choice===play.q.answer?1:0),max=keys().length+(play.q?1:0);results.set(play.id,[n,max]);score=[...results.values()].reduce((a,v)=>a+v[0],0);total=[...results.values()].reduce((a,v)=>a+v[1],0);stage='review';render();}
function render(){let info=play.goal?`<div class="gameinfo"><span>${play.goal===3?'3RD':'4TH'} &amp; ${play.goal}</span><span>NO-RUN ZONE</span></div>`:'';let controls='';if(stage==='formation')controls='<h2>Read the formation.</h2><button id="snap" class="primary">'+(play.motion?'CONTINUE':'SNAP BALL')+'</button>';if(stage==='delay')controls='<p>Watch the centers delayed release.</p><button id="continueDelay" class="primary">CONTINUE PLAY</button>';if(stage==='running')controls='<p class="step">Watch the play develop...</p>';if(stage==='question'||stage==='motion')controls=`<h2>${play.q.prompt}</h2><div class="qgrid">${play.q.options.map((o,i)=>`<button data-choice="${i}">${o}</button>`).join('')}</div>`;if(stage==='assign')controls=`<p class="step">SELECT A DEFENDER</p><div class="grid">${keys().map(k=>`<button data-defender="${k}" class="assign-btn ${active===k?'selected':''}"><span>${names[k]}</span><b>${answers[k]||'-'}</b></button>`).join('')}</div><p class="step">CHOOSE THEIR RESPONSIBILITY</p><div class="choices">${play.receivers.filter(o=>play.manual||o.id!=='QB').map(o=>`<button class="receiver ${answers[active]===o.id?'selected':''}" data-receiver="${o.id}">${o.id}</button>`).join('')}</div>${!play.manual?'<p class="auto">Rusher: QB (automatic)</p>':''}<button id="lock" class="primary" ${keys().some(k=>!answers[k])?'disabled':''}>LOCK IN DEFENSE</button>`;if(stage==='review'){let n=keys().filter(k=>answers[k]===play.ans[k]).length+(play.q&&choice===play.q.answer?1:0);controls=`<div class="result"><h2 class="lime">${n}/${keys().length+(play.q?1:0)} CORRECT</h2><span>${play.name}</span></div>${play.q?`<div class="decision"><b class="${choice===play.q.answer?'correct':'wrong'}">${choice===play.q.answer?'Correct':'Review'} decision</b><p>${play.q.why}</p></div>`:''}${keys().map(k=>`<div class="row feedback"><span class="${answers[k]===play.ans[k]?'correct':'wrong'}">${answers[k]===play.ans[k]?'OK':'MISS'} &nbsp; ${names[k]}</span><b>${play.ans[k]}</b>${answers[k]!==play.ans[k]?`<small>Your answer: ${answers[k]}</small>`:''}</div>`).join('')}<button id="next" class="primary">${index===order.length-1?'FINISH SESSION':'NEXT PLAY'}</button><div class="actions"><button id="replay">REPLAY ANIMATION</button><button id="retry">TRY AGAIN</button></div>`;}
app.innerHTML=`<div class="panel"><div class="row stats"><span>PLAY ${mode==='coach'?play.id:index+1}/${order.length}</span><span class="lime">${score}/${total} POINTS</span></div><div class="bar"><i style="width:${100*index/order.length}%"></i></div>${info}<div id="fieldwrap">${field()}</div><div class="legend"><span><i class="dot" style="background:#ff329b"></i>Offense</span><span><i class="dot" style="background:#b7ff30"></i>Defense</span><span><i class="dot" style="background:#ffd450"></i>Ball</span></div><div class="step">${stage==='formation'?'PRE-SNAP':stage==='review'?'PLAY REVIEW':stage==='assign'?'MAKE THE CALL':stage==='running'?'LIVE PLAY':'READ & REACT'}</div>${controls}</div>${mode==='coach'?`<div class="panel row coachtools"><select id="jump" aria-label="Jump to play">${plays.map(p=>`<option value="${p.id-1}" ${p.id===play.id?'selected':''}>${p.id} - ${p.name}</option>`).join('')}</select><button id="prevcoach" ${index===0?'disabled':''}>PREVIOUS PLAY</button><button id="nextcoach" ${index===order.length-1?'disabled':''}>NEXT FORMATION</button></div>`:''}<button class="quit" id="quit">END SESSION</button>`;}
function finish(){cancelAnimationFrame(animation);elapsed=Math.round((Date.now()-started)/1000);app.innerHTML=`<div class="panel"><h2>SESSION COMPLETE</h2><h1 class="lime">${total?Math.round(score/total*100):0}%</h1><p>${score} of ${total} points</p>${timed?`<p>Time: ${Math.floor(elapsed/60)}m ${elapsed%60}s</p>`:''}<button class="primary" id="home">PLAY AGAIN</button></div>`;}
app.addEventListener('change',e=>{if(e.target.id==='jump'){cancelAnimationFrame(animation);index=Number(e.target.value);load();}});app.addEventListener('click',e=>{let el=e.target.closest('button,[data-defender],[data-receiver]');if(!el||el.disabled)return;if(el.id==='prevcoach'||el.id==='nextcoach'){cancelAnimationFrame(animation);index+=el.id==='prevcoach'?-1:1;load();return;}if(el.id==='snap')snap();if(el.id==='continueDelay')animate(1,()=>{stage='assign';render()});if(el.id==='lock')lock();if(el.id==='next'){if(++index>=order.length)finish();else load();}if(el.id==='home')home();if(el.id==='quit'){if(confirm('End this session?'))finish();}if(el.id==='retry')load();if(el.id==='replay'){progress=0;animate(1,()=>{stage='review';render()});}if(el.dataset.choice!==undefined)choose(Number(el.dataset.choice));if(stage==='assign'&&el.dataset.defender){active=el.dataset.defender;render();}if(stage==='assign'&&el.dataset.receiver)assign(el.dataset.receiver);});home();window.fireTest={plays,get stage(){return stage},get score(){return score},get total(){return total},get play(){return play}};
</script></body></html>
